<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
<title>WebSpeak</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<form id="form" novalidate>
  <h1 data-t="settingsTitle"></h1>

  <section>
    <h2 data-t="server"></h2>
    <input type="url" id="serverUrl" spellcheck="false" autocomplete="off">
    <p class="hint" data-t="serverHint"></p>
    <p class="error" id="serverError" hidden data-t="serverInvalid"></p>
  </section>

  <section>
    <h2 data-t="startup"></h2>
    <label class="check"><input type="checkbox" id="launchAtLogin"> <span data-t="launchAtLogin"></span></label>
    <label class="check"><input type="checkbox" id="startHidden"> <span data-t="startHidden"></span></label>
    <label class="check"><input type="checkbox" id="closeToTray"> <span data-t="closeToTray"></span></label>
  </section>

  <section>
    <h2 data-t="hotkeys"></h2>
    <p class="hint" data-t="hotkeysHint"></p>
    <p class="hint" data-t="hotkeySingleHint"></p>
    <div class="hotkeys" id="hotkeys"></div>
    <label class="field"><span data-t="streamSource"></span>
      <select id="streamHotkeySource">
        <option value="picker" data-t="streamSourcePicker"></option>
        <option value="screen" data-t="streamSourceScreen"></option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="hotkeySounds"> <span data-t="hotkeySounds"></span></label>
  </section>

  <section>
    <h2 data-t="pttTitle"></h2>
    <p class="hint" data-t="pttHint"></p>
    <div class="hotkeys" id="ptt"></div>
  </section>

  <section>
    <h2 data-t="overlayTitle"></h2>
    <p class="hint" data-t="overlayHint"></p>
    <label class="check"><input type="checkbox" id="overlayEnabled"> <span data-t="overlayEnabled"></span></label>
    <fieldset id="overlayOptions" class="overlay-options">
      <label class="field"><span data-t="overlayCorner"></span>
        <select id="overlayCorner">
          <option value="top-left" data-t="overlayCornerTopLeft"></option>
          <option value="top-right" data-t="overlayCornerTopRight"></option>
          <option value="bottom-left" data-t="overlayCornerBottomLeft"></option>
          <option value="bottom-right" data-t="overlayCornerBottomRight"></option>
        </select>
      </label>
      <label class="field"><span data-t="overlayMode"></span>
        <select id="overlayMode">
          <option value="channel" data-t="overlayModeChannel"></option>
          <option value="speaking" data-t="overlayModeSpeaking"></option>
        </select>
      </label>
      <label class="field range"><span data-t="overlayScale"></span>
        <input type="range" id="overlayScale" min="60" max="200" step="10"><output id="overlayScaleValue"></output>
      </label>
      <label class="field range"><span data-t="overlayOpacity"></span>
        <input type="range" id="overlayOpacity" min="20" max="100" step="5"><output id="overlayOpacityValue"></output>
      </label>
      <div class="field"><span data-t="overlayOffset"></span>
        <div class="offsets">
          <label><span data-t="overlayOffsetX"></span> <input type="number" id="overlayOffsetX" min="0" max="2000" step="1"></label>
          <label><span data-t="overlayOffsetY"></span> <input type="number" id="overlayOffsetY" min="0" max="2000" step="1"></label>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="overlayShowSelf"> <span data-t="overlayShowSelf"></span></label>
      <label class="check"><input type="checkbox" id="overlayShowChannel"> <span data-t="overlayShowChannel"></span></label>
      <p class="hint" data-t="overlayFullscreenHint"></p>
    </fieldset>
  </section>

  <section>
    <h2 data-t="updates"></h2>
    <div class="update-row">
      <span id="version"></span>
      <span id="updateStatus" class="hint"></span>
      <button type="button" class="button" id="updateButton"></button>
    </div>
  </section>

  <footer>
    <span id="savedNote" class="saved" hidden data-t="saved"></span>
    <button type="button" class="button" id="close" data-t="cancel"></button>
    <button type="submit" class="button primary" id="save" data-t="save"></button>
  </footer>
</form>
<script src="settings.js"></script>
</body>
</html>
