<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'self'">
<title>WebSpeak</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="picker.css">
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-screen" data-kind="screen"></button>
    <button type="button" role="tab" id="tab-window" data-kind="window"></button>
  </div>
  <div id="grid" class="grid" role="listbox"></div>
  <footer>
    <label class="audio"><input type="checkbox" id="audio"> <span id="audio-label"></span></label>
    <div class="actions">
      <button type="button" class="button" id="cancel"></button>
      <button type="button" class="button primary" id="share" disabled></button>
    </div>
  </footer>
</main>
<script src="picker.js"></script>
</body>
</html>
