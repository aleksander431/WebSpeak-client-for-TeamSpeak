services:
  webspeak:
    # Runs the image GitHub Actions builds from this fork. Pin a release in
    # .env (WEBSPEAK_IMAGE=ghcr.io/aleksander431/webspeak:v0.4.0) or leave the
    # default to follow master. Update: docker compose pull && docker compose up -d
    # To build from this checkout instead: docker compose up -d --build
    image: ${WEBSPEAK_IMAGE:-ghcr.io/aleksander431/webspeak:latest}
    build: .
    pull_policy: missing
    restart: unless-stopped
    # WebSpeak needs to reach a TeamSpeak server running on the same host.
    # Host networking also exposes the configured WebRTC UDP range directly.
    network_mode: host
    environment:
      # Address(es) of your reverse proxy when it is not on this host's
      # loopback, e.g. WEBSPEAK_TRUSTED_PROXIES=192.168.50.111 in .env.
      # Only these may tell WebSpeak the real visitor IP (X-Real-IP / X-Forwarded-For).
      WEBSPEAK_TRUSTED_PROXIES: ${WEBSPEAK_TRUSTED_PROXIES:-}
    volumes:
      - webspeak-data:/data

volumes:
  webspeak-data:
